<!DOCTYPE html>
<html>
<head>
  <!-- Replaced by "flutter build web --base-href". -->
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="AduChat: private messages, groups, voice and video calls. English, Soomaali, العربية.">
  <meta name="theme-color" content="#00897B">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="AduChat">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>AduChat</title>
  <style>
    html, body { margin: 0; height: 100%; background: #00897B; }
    #loading { position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; color: #fff;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    #loading img { width: 120px; height: 120px; border-radius: 28px; }
    #loading p { margin-top: 16px; font-size: 18px; letter-spacing: .5px; }
  </style>
</head>
<body>
  <div id="loading" aria-live="polite">
    <img src="icons/Icon-192.png" alt="AduChat">
    <p>AduChat</p>
  </div>
  <noscript>AduChat needs JavaScript to run.</noscript>
  <script>
    // Remove the loading screen once Flutter has drawn its first frame.
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('loading');
      if (el) el.remove();
    });
  </script>
  <script src="notify.js"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
