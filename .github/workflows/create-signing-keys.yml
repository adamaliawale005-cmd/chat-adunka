name: Create signing keys (run once)

# Generates the permanent release signing key for AduChat. The key is
# delivered as a short-lived private artifact (deleted after 1 day) together
# with instructions for turning them into repository secrets. Nothing is
# committed and no secret is printed in the log.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keys:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Generate keys
        run: |
          mkdir -p out && cd out
          PASS=$(openssl rand -base64 24 | tr -d '/+=' | cut -c1-24)
          keytool -genkeypair -v -keystore release.keystore -storepass "$PASS" -keypass "$PASS" \
            -alias aduchat -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=AduChat,O=AduChat,C=SO" > /dev/null 2>&1
          {
            echo "AduChat signing key. Keep this file private and delete it after use."
            echo
            echo "Create these 2 repository secrets (Settings > Secrets and variables > Actions):"
            echo
            echo "ANDROID_RELEASE_KEYSTORE_BASE64 = the whole content of release.keystore.base64.txt"
            echo "ANDROID_RELEASE_STORE_PASSWORD = $PASS"
            echo
            echo "Also keep release.keystore and the password somewhere safe outside GitHub:"
            echo "every future AduChat update must be signed with this same key."
            echo
            echo "Optional (only for phone-number sign-in): add these fingerprints in Firebase"
            echo "(Project settings > Your apps > AduChat Android > Add fingerprint):"
            keytool -list -v -keystore release.keystore -storepass "$PASS" | grep -E "SHA1:|SHA256:"
          } > README.txt
          base64 -w0 release.keystore > release.keystore.base64.txt
          echo "Keys generated."
      - uses: actions/upload-artifact@v4
        with:
          name: aduchat-signing-keys-PRIVATE
          path: out/
          retention-days: 1
