name: Generate Android project (one-off)

# Run manually once to create the permanent android/ folder. It is pushed to
# the branch "android-scaffold" for review; the regular build never
# regenerates it afterwards.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Create Android project
        run: |
          flutter --version | tee flutter-version.txt
          rm -rf android
          flutter create --org com.aduchat --project-name chat_adunka --platforms=android .
          python3 tool/configure_android.py .
          # flutter create also writes these; keep the repo's own versions.
          git checkout -- lib test pubspec.yaml README.md 2>/dev/null || true
          git status --short
      - name: Push to android-scaffold branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b android-scaffold
          git add -f android flutter-version.txt
          git commit -m "Generate permanent Android project (flutter create)"
          git push -f origin android-scaffold
