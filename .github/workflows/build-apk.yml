name: AduChat CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Credentials scan, format, analyze, tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Scan for committed credentials
        run: |
          mkdir -p ci-logs
          python3 tool/ci/scan_secrets.py 2>&1 | tee ci-logs/secrets.log; exit ${PIPESTATUS[0]}

      - name: Install dependencies
        run: |
          flutter --version | tee ci-logs/flutter-version.log
          flutter pub get 2>&1 | tee ci-logs/pubget.log; exit ${PIPESTATUS[0]}

      - name: Dependency report (security advisories and outdated packages)
        continue-on-error: true
        run: |
          flutter pub outdated --no-dev-dependencies 2>&1 | tee ci-logs/outdated.log
          if grep -qi "advisor" ci-logs/pubget.log ci-logs/outdated.log; then
            echo "::warning title=Dependency advisories::See ci-logs/pubget.log"
          fi

      - name: Check Dart formatting
        id: format
        continue-on-error: true
        run: |
          dart format --output=none --set-exit-if-changed lib test 2>&1 | tee ci-logs/format.log
          code=${PIPESTATUS[0]}
          if [ $code -ne 0 ]; then
            dart format lib test > /dev/null
            git diff > ci-logs/format.patch
            git checkout -- lib test
          fi
          exit $code

      - name: Static analysis
        id: analyze
        continue-on-error: true
        run: flutter analyze --no-fatal-infos 2>&1 | tee ci-logs/analyze.log; exit ${PIPESTATUS[0]}

      - name: Automated tests
        id: tests
        continue-on-error: true
        run: flutter test --reporter expanded 2>&1 | tee ci-logs/test.log; exit ${PIPESTATUS[0]}

      - name: Result
        run: |
          echo "format=${{ steps.format.outcome }} analyze=${{ steps.analyze.outcome }} tests=${{ steps.tests.outcome }}" | tee ci-logs/checks-summary.log
          for s in "${{ steps.format.outcome }}" "${{ steps.analyze.outcome }}" "${{ steps.tests.outcome }}"; do
            [ "$s" = "success" ] || exit 1
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-checks
          path: ci-logs/
          retention-days: 7

  rules:
    name: Firestore and Storage security rules tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Check Cloud Functions source
        run: |
          mkdir -p ci-logs
          node --check functions/index.js 2>&1 | tee ci-logs/functions-check.log
          exit ${PIPESTATUS[0]}
      - name: Run rules tests in the Firebase emulator
        working-directory: firebase-tests
        run: |
          mkdir -p ../ci-logs
          npm install --no-audit --no-fund 2>&1 | tail -5
          npx firebase emulators:exec --project demo-aduchat --only firestore,storage "node --test --test-concurrency=1" 2>&1 | tee ../ci-logs/rules-test.log
          exit ${PIPESTATUS[0]}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-rules
          path: ci-logs/
          retention-days: 7

  build:
    name: Build Android APK
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # The runner image is nearly full; WebRTC native libraries need room.
      - name: Free disk space
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/node_modules /opt/ghc /usr/local/.ghcup \
            /usr/local/share/boost /usr/share/swift /opt/hostedtoolcache/CodeQL \
            /usr/local/share/powershell /usr/local/share/chromium /usr/lib/jvm/java-8* || true
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          df -h / | tail -1

      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Firebase settings and feature switches come from repository secrets
      # and variables. Nothing is committed; values are never printed.
      - name: Validate Firebase configuration
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          TURN_URLS: ${{ secrets.TURN_URLS }}
          TURN_USERNAME: ${{ secrets.TURN_USERNAME }}
          TURN_CREDENTIAL: ${{ secrets.TURN_CREDENTIAL }}
          STORAGE_ENABLED: ${{ vars.STORAGE_ENABLED }}
          EMAIL_AUTH_ENABLED: ${{ vars.EMAIL_AUTH_ENABLED }}
          PHONE_AUTH_ENABLED: ${{ vars.PHONE_AUTH_ENABLED }}
        run: |
          mkdir -p ci-logs
          python3 tool/ci/firebase_check.py "$RUNNER_TEMP/defines.json" 2>&1 | tee ci-logs/firebase-check.log
          exit ${PIPESTATUS[0]}

      - name: Install signing keys
        env:
          DEBUG_KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          if [ -n "$DEBUG_KEYSTORE" ]; then
            mkdir -p ~/.android
            echo "$DEBUG_KEYSTORE" | base64 -d > ~/.android/debug.keystore
            echo "::notice title=Debug signing::Using the stable debug key from secrets."
          else
            echo "::warning title=Debug signing::ANDROID_DEBUG_KEYSTORE_BASE64 is not set. This build uses a temporary key: Firebase phone sign-in will fail and the APK cannot update an earlier install. Run the 'Create signing keys' workflow."
          fi
          if [ -n "$RELEASE_KEYSTORE" ] && [ -n "$RELEASE_STORE_PASSWORD" ] && [ -n "$RELEASE_KEY_ALIAS" ]; then
            echo "$RELEASE_KEYSTORE" | base64 -d > android/app/release.keystore
            {
              echo "storeFile=release.keystore"
              echo "storePassword=$RELEASE_STORE_PASSWORD"
              echo "keyAlias=$RELEASE_KEY_ALIAS"
              echo "keyPassword=${RELEASE_KEY_PASSWORD:-$RELEASE_STORE_PASSWORD}"
            } > android/key.properties
            echo "HAS_RELEASE_KEY=true" >> "$GITHUB_ENV"
          else
            echo "::notice title=Release signing::No release key secrets, so only the debug APK is built."
          fi

      - name: Install dependencies
        run: flutter pub get 2>&1 | tee ci-logs/build-pubget.log; exit ${PIPESTATUS[0]}

      - name: Build debug APK
        run: |
          flutter build apk --debug --target-platform android-arm,android-arm64 --dart-define-from-file="$RUNNER_TEMP/defines.json" 2>&1 | tee ci-logs/build-debug.log
          exit ${PIPESTATUS[0]}

      - name: Build release APK
        if: env.HAS_RELEASE_KEY == 'true'
        run: |
          flutter build apk --release --target-platform android-arm,android-arm64 --dart-define-from-file="$RUNNER_TEMP/defines.json" 2>&1 | tee ci-logs/build-release.log
          exit ${PIPESTATUS[0]}

      - name: Signing fingerprints (add these in Firebase)
        if: always()
        run: |
          {
            echo "Debug key:"
            keytool -list -v -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android 2>/dev/null | grep -E "SHA1:|SHA256:"
            if [ -f android/app/release.keystore ]; then
              echo "Release key:"
              keytool -list -v -keystore android/app/release.keystore -storepass "$(grep storePassword android/key.properties | cut -d= -f2-)" 2>/dev/null | grep -E "SHA1:|SHA256:"
            fi
          } | tee ci-logs/fingerprints.log
          echo "::notice title=SHA fingerprints::$(tr '\n' ' ' < ci-logs/fingerprints.log)"
          rm -f android/key.properties android/app/release.keystore

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AduChat-debug-APK
          path: build/app/outputs/flutter-apk/app-debug.apk

      - name: Upload release APK
        if: env.HAS_RELEASE_KEY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: AduChat-release-APK
          path: build/app/outputs/flutter-apk/app-release.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-build
          path: ci-logs/
          retention-days: 7

  # Publishes all logs to the "ci-logs" branch so they can be read with git
  # (the newest run replaces the previous one).
  report:
    name: Publish logs
    needs: [checks, rules, build]
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: logs-*
          path: logs
      - name: Push logs
        run: |
          cd logs
          {
            echo "run: ${{ github.run_id }}"
            echo "branch: ${{ github.ref_name }}"
            echo "commit: ${{ github.sha }}"
            echo "checks: ${{ needs.checks.result }}"
            echo "rules: ${{ needs.rules.result }}"
            echo "build: ${{ needs.build.result }}"
          } > SUMMARY.txt
          git init -q -b ci-logs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "CI logs for run ${{ github.run_id }} (${{ github.ref_name }})"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-logs
