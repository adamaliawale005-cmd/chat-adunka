name: AduChat CI

on:
  push:
    branches:
      - main
      - dev
      - 'feature/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Credentials scan, format, analyze, tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Scan for committed credentials
        run: |
          mkdir -p ci-logs
          python3 tool/ci/scan_secrets.py 2>&1 | tee ci-logs/secrets.log; exit ${PIPESTATUS[0]}

      - name: Install dependencies
        run: |
          flutter --version | tee ci-logs/flutter-version.log
          flutter pub get 2>&1 | tee ci-logs/pubget.log; exit ${PIPESTATUS[0]}

      - name: Dependency report (security advisories and outdated packages)
        continue-on-error: true
        run: |
          flutter pub outdated --no-dev-dependencies 2>&1 | tee ci-logs/outdated.log
          if grep -qi "advisor" ci-logs/pubget.log ci-logs/outdated.log; then
            echo "::warning title=Dependency advisories::See ci-logs/pubget.log"
          fi

      - name: Check Dart formatting
        id: format
        continue-on-error: true
        run: |
          dart format --output=none --set-exit-if-changed lib test integration_test 2>&1 | tee ci-logs/format.log
          code=${PIPESTATUS[0]}
          if [ $code -ne 0 ]; then
            dart format lib test integration_test > /dev/null
            git diff > ci-logs/format.patch
            git checkout -- lib test integration_test
          fi
          exit $code

      - name: Static analysis
        id: analyze
        continue-on-error: true
        run: flutter analyze --no-fatal-infos 2>&1 | tee ci-logs/analyze.log; exit ${PIPESTATUS[0]}

      - name: Automated tests
        id: tests
        continue-on-error: true
        run: flutter test --reporter expanded 2>&1 | tee ci-logs/test.log; exit ${PIPESTATUS[0]}

      - name: Result
        run: |
          echo "format=${{ steps.format.outcome }} analyze=${{ steps.analyze.outcome }} tests=${{ steps.tests.outcome }}" | tee ci-logs/checks-summary.log
          for s in "${{ steps.format.outcome }}" "${{ steps.analyze.outcome }}" "${{ steps.tests.outcome }}"; do
            [ "$s" = "success" ] || exit 1
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-checks
          path: ci-logs/
          retention-days: 7

  rules:
    name: Firestore and Storage security rules tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Check Cloud Functions source
        run: |
          mkdir -p ci-logs
          node --check functions/index.js 2>&1 | tee ci-logs/functions-check.log
          exit ${PIPESTATUS[0]}
      - name: Run rules tests in the Firebase emulator
        working-directory: firebase-tests
        run: |
          mkdir -p ../ci-logs
          npm install --no-audit --no-fund 2>&1 | tail -5
          npx firebase emulators:exec --project demo-aduchat --only firestore,storage "node --test --test-concurrency=1" 2>&1 | tee ../ci-logs/rules-test.log
          exit ${PIPESTATUS[0]}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-rules
          path: ci-logs/
          retention-days: 7

  e2e:
    name: End-to-end test on an Android emulator (Firebase emulators)
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/node_modules /opt/ghc /usr/local/.ghcup \
            /usr/local/share/boost /usr/share/swift /opt/hostedtoolcache/CodeQL \
            /usr/local/share/powershell /usr/local/share/chromium || true
          df -h / | tail -1

      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable KVM for the Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Start Firebase emulators (Auth + Firestore with firestore.rules)
        run: |
          mkdir -p ci-logs
          cd firebase-tests && npm install --no-audit --no-fund 2>&1 | tail -2
          nohup npx firebase emulators:start --project demo-aduchat --only auth,firestore > ../ci-logs/emulators.log 2>&1 &
          for i in $(seq 1 90); do
            if curl -s localhost:8080 > /dev/null && curl -s localhost:9099 > /dev/null; then echo "emulators ready"; exit 0; fi
            sleep 2
          done
          cat ../ci-logs/emulators.log; exit 1

      - name: Install dependencies
        run: flutter pub get

      - name: Run the app flow on an Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 32
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tool/ci/run_e2e.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-e2e
          path: ci-logs/
          retention-days: 7

  build:
    name: Build Android APK
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # The runner image is nearly full; WebRTC native libraries need room.
      - name: Free disk space
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/node_modules /opt/ghc /usr/local/.ghcup \
            /usr/local/share/boost /usr/share/swift /opt/hostedtoolcache/CodeQL \
            /usr/local/share/powershell /usr/local/share/chromium /usr/lib/jvm/java-8* || true
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          df -h / | tail -1

      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Firebase settings and feature switches come from repository secrets
      # and variables. Nothing is committed; values are never printed.
      - name: Validate Firebase configuration
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          TURN_URLS: ${{ secrets.TURN_URLS }}
          TURN_USERNAME: ${{ secrets.TURN_USERNAME }}
          TURN_CREDENTIAL: ${{ secrets.TURN_CREDENTIAL }}
          STORAGE_ENABLED: ${{ vars.STORAGE_ENABLED }}
          EMAIL_AUTH_ENABLED: ${{ vars.EMAIL_AUTH_ENABLED }}
          PHONE_AUTH_ENABLED: ${{ vars.PHONE_AUTH_ENABLED }}
        run: |
          mkdir -p ci-logs
          python3 tool/ci/firebase_check.py "$RUNNER_TEMP/defines.json" 2>&1 | tee ci-logs/firebase-check.log
          exit ${PIPESTATUS[0]}

      - name: Install signing keys
        env:
          DEBUG_KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          if [ -n "$DEBUG_KEYSTORE" ]; then
            mkdir -p ~/.android
            echo "$DEBUG_KEYSTORE" | base64 -d > ~/.android/debug.keystore
            echo "::notice title=Debug signing::Using the stable debug key from secrets."
          else
            echo "::warning title=Debug signing::ANDROID_DEBUG_KEYSTORE_BASE64 is not set. This build uses a temporary key: Firebase phone sign-in will fail and the APK cannot update an earlier install. Run the 'Create signing keys' workflow."
          fi
          RELEASE_KEY_ALIAS="${RELEASE_KEY_ALIAS:-aduchat}"
          if [ -n "$RELEASE_KEYSTORE" ] && [ -n "$RELEASE_STORE_PASSWORD" ]; then
            echo "$RELEASE_KEYSTORE" | base64 -d > android/app/release.keystore
            {
              echo "storeFile=release.keystore"
              echo "storePassword=$RELEASE_STORE_PASSWORD"
              echo "keyAlias=$RELEASE_KEY_ALIAS"
              echo "keyPassword=${RELEASE_KEY_PASSWORD:-$RELEASE_STORE_PASSWORD}"
            } > android/key.properties
            echo "HAS_RELEASE_KEY=true" >> "$GITHUB_ENV"
          else
            echo "::warning title=Release signing::Secrets ANDROID_RELEASE_KEYSTORE_BASE64 and ANDROID_RELEASE_STORE_PASSWORD are not set, so only a test (debug) APK is built: no release APK and no Google Play App Bundle. Run the 'Create signing keys' workflow once."
          fi

      - name: Install dependencies
        run: flutter pub get 2>&1 | tee ci-logs/build-pubget.log; exit ${PIPESTATUS[0]}

      - name: Build debug APK
        run: |
          flutter build apk --debug --target-platform android-arm,android-arm64 --dart-define-from-file="$RUNNER_TEMP/defines.json" 2>&1 | tee ci-logs/build-debug.log
          exit ${PIPESTATUS[0]}

      - name: Check Google Play target SDK (API 36 or later)
        shell: bash
        run: |
          set +e
          apk=build/app/outputs/flutter-apk/app-debug.apk
          AAPT2=$(find "$ANDROID_HOME/build-tools" -name aapt2 -type f 2>/dev/null | sort -V | tail -1)
          echo "aapt2: ${AAPT2:-not found}"
          "$AAPT2" dump badging "$apk" > ci-logs/badging.txt 2> ci-logs/badging-err.txt
          head -3 ci-logs/badging.txt; cat ci-logs/badging-err.txt | head -5
          target=$(grep -o "targetSdkVersion:'[0-9]*'" ci-logs/badging.txt | head -1 | tr -dc '0-9')
          min=$(grep -o "^sdkVersion:'[0-9]*'" ci-logs/badging.txt | head -1 | tr -dc '0-9')
          echo "::notice title=Android SDK levels::targetSdk=${target:-unknown} minSdk=${min:-unknown}"
          if [ -z "$target" ]; then
            echo "::error title=Google Play::Could not read targetSdk from the APK."
            exit 1
          fi
          if [ "$target" -lt 36 ]; then
            echo "::error title=Google Play::targetSdk $target is below 36, which Google Play requires."
            exit 1
          fi

      - name: Build release APK
        if: env.HAS_RELEASE_KEY == 'true'
        run: |
          flutter build apk --release --target-platform android-arm,android-arm64 --dart-define-from-file="$RUNNER_TEMP/defines.json" 2>&1 | tee ci-logs/build-release.log
          exit ${PIPESTATUS[0]}

      # Google Play upload format. Only built with the permanent release key;
      # never signed with a debug or temporary key.
      - name: Build release App Bundle (Google Play)
        if: env.HAS_RELEASE_KEY == 'true'
        run: |
          flutter build appbundle --release --dart-define-from-file="$RUNNER_TEMP/defines.json" 2>&1 | tee ci-logs/build-aab.log
          exit ${PIPESTATUS[0]}

      - name: Signing fingerprints (add these in Firebase)
        if: always()
        run: |
          {
            echo "Debug key:"
            keytool -list -v -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android 2>/dev/null | grep -E "SHA1:|SHA256:"
            if [ -f android/app/release.keystore ]; then
              echo "Release key:"
              keytool -list -v -keystore android/app/release.keystore -storepass "$(grep storePassword android/key.properties | cut -d= -f2-)" 2>/dev/null | grep -E "SHA1:|SHA256:"
            fi
          } | tee ci-logs/fingerprints.log
          echo "::notice title=SHA fingerprints::$(tr '\n' ' ' < ci-logs/fingerprints.log)"
          rm -f android/key.properties android/app/release.keystore

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AduChat-debug-APK
          path: build/app/outputs/flutter-apk/app-debug.apk

      - name: Upload release APK
        if: env.HAS_RELEASE_KEY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: AduChat-APK
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload release App Bundle
        if: env.HAS_RELEASE_KEY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: AduChat-release-AAB
          path: build/app/outputs/bundle/release/app-release.aab

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-build
          path: ci-logs/
          retention-days: 7

  prod-check:
    name: Live backend check (two accounts, aduchat-c4ee6)
    needs: checks
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Register, message and clean up on the live project
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
        run: |
          mkdir -p ci-logs
          python3 tool/ci/prod_check.py 2>&1 | tee ci-logs/prod-check.log
          exit ${PIPESTATUS[0]}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-prod
          path: ci-logs/
          retention-days: 7

  web:
    name: Build web app
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Same validated settings as the APK, so web and phones share one backend.
      - name: Validate Firebase configuration
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_WEB_APP_ID: ${{ secrets.FIREBASE_WEB_APP_ID }}
          TURN_URLS: ${{ secrets.TURN_URLS }}
          TURN_USERNAME: ${{ secrets.TURN_USERNAME }}
          TURN_CREDENTIAL: ${{ secrets.TURN_CREDENTIAL }}
          STORAGE_ENABLED: ${{ vars.STORAGE_ENABLED }}
          EMAIL_AUTH_ENABLED: ${{ vars.EMAIL_AUTH_ENABLED }}
          PHONE_AUTH_ENABLED: ${{ vars.PHONE_AUTH_ENABLED }}
        run: |
          mkdir -p ci-logs
          python3 tool/ci/firebase_check.py "$RUNNER_TEMP/defines.json" 2>&1 | tee ci-logs/web-firebase-check.log
          exit ${PIPESTATUS[0]}

      - name: Build web app
        run: |
          flutter pub get > ci-logs/web-pubget.log 2>&1
          flutter build web --release --base-href "/${{ github.event.repository.name }}/" \
            --dart-define-from-file="$RUNNER_TEMP/defines.json" 2>&1 | tee ci-logs/build-web.log
          code=${PIPESTATUS[0]}
          # GitHub Pages serves 404.html for unknown paths; reuse the app.
          [ $code -eq 0 ] && cp build/web/index.html build/web/404.html
          exit $code

      # Opens the built site in a real browser and checks the app starts and
      # reaches the sign-in screen (connects to Firebase without errors).
      - name: Browser smoke test (local)
        run: |
          pip install --quiet playwright==1.48.0
          python3 -m playwright install --with-deps chromium > /dev/null 2>&1
          python3 tool/ci/web_smoke.py --serve build/web --base "/${{ github.event.repository.name }}/" 2>&1 | tee ci-logs/web-smoke.log
          exit ${PIPESTATUS[0]}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-web
          path: ci-logs/
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web
          retention-days: 3

      - name: Package site for GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  web-notify:
    name: Web notifications in a real browser (two accounts, aduchat-c4ee6)
    needs: web
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: web-build
          path: build/web
      - name: Sign in on the web app and receive notifications
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
        run: |
          mkdir -p ci-logs
          pip install --quiet playwright==1.48.0
          python3 -m playwright install --with-deps chromium > /dev/null 2>&1
          python3 tool/ci/web_notify_check.py --serve build/web --base "/${{ github.event.repository.name }}/" 2>&1 | tee ci-logs/web-notify.log
          exit ${PIPESTATUS[0]}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-web-notify
          path: ci-logs/
          retention-days: 7

  deploy-web:
    name: Publish web app (GitHub Pages)
    needs: [web, rules]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
      - uses: actions/checkout@v5
      - name: Check the public site
        run: |
          mkdir -p ci-logs
          pip install --quiet playwright==1.48.0 >/dev/null 2>&1 || true
          python3 -m playwright install --with-deps chromium > /dev/null 2>&1
          python3 tool/ci/web_smoke.py --url "${{ steps.deploy.outputs.page_url }}" 2>&1 | tee ci-logs/web-live.log
          exit ${PIPESTATUS[0]}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-web-live
          path: ci-logs/
          retention-days: 7

  # Publishes all logs to the "ci-logs" branch so they can be read with git
  # (the newest run replaces the previous one).
  report:
    name: Publish logs
    needs: [checks, rules, e2e, build, web, web-notify, deploy-web, prod-check]
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: logs-*
          path: logs
      - name: Push logs
        run: |
          cd logs
          {
            echo "run: ${{ github.run_id }}"
            echo "branch: ${{ github.ref_name }}"
            echo "commit: ${{ github.sha }}"
            echo "checks: ${{ needs.checks.result }}"
            echo "rules: ${{ needs.rules.result }}"
            echo "e2e: ${{ needs.e2e.result }}"
            echo "build: ${{ needs.build.result }}"
            echo "web: ${{ needs.web.result }}"
            echo "web-notify: ${{ needs.web-notify.result }}"
            echo "deploy-web: ${{ needs.deploy-web.result }}"
            echo "prod-check: ${{ needs.prod-check.result }}"
          } > SUMMARY.txt
          git init -q -b ci-logs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "CI logs for run ${{ github.run_id }} (${{ github.ref_name }})"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-logs
