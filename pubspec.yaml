name: chat_adunka
description: AduChat (Chat Aduunka) global messaging app
publish_to: 'none'

# Version name and build number used for the Android app.
# Increase the number after "+" for every release that is installed over
# an older one.
version: 2.0.0+3

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Firebase (FlutterFire, matching release family)
  firebase_core: ^3.15.2
  firebase_auth: ^5.7.0
  cloud_firestore: ^5.6.12
  firebase_messaging: ^15.2.10
  firebase_storage: ^12.4.10

  # UI and utilities
  intl: any
  shared_preferences: ^2.3.2
  uuid: ^4.5.1
  country_picker: ^2.0.26

  # Media, files and devices
  image_picker: ^1.1.2
  file_picker: '>=8.1.2 <11.0.0'
  record: '>=5.2.0 <7.0.0'
  audioplayers: '>=6.1.0 <7.0.0'
  video_player: ^2.9.2
  path_provider: ^2.1.5
  url_launcher: ^6.3.1
  permission_handler: '>=11.3.1 <13.0.0'
  flutter_contacts: ^1.1.9+2

  # Calls and notifications
  flutter_webrtc: '>=0.12.0 <2.0.0'
  flutter_local_notifications: ^19.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
